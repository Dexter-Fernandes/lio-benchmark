[project]
name = "lio-benchmark"
version = "0.1.0"
description = "Reproducible LiDAR-inertial odometry benchmarking on Hilti-Oxford 2022"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "rosbags>=0.10",
    "matplotlib>=3.8",
    "wandb>=0.17",
    "wandb-workspaces>=0.4",
]

[project.scripts]
lio-bench = "lio_benchmark.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "evo>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lio_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
